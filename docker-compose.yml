version: '3.9'

name: fliv

services:
  postgres:
    container_name: fliv-postgres
    image: postgres:18
    restart: unless-stopped
    ports:
      - '5433:5432'
    environment:
      POSTGRES_USER: ${PG_USER:-postgres}
      POSTGRES_PASSWORD: ${PG_PASSWORD:-password}
      POSTGRES_DB: ${PG_DB:-fliv}
    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U $$POSTGRES_USER']
      interval: 5s
      retries: 5
      start_period: 5s
    networks:
      - postgres

networks:
  postgres:
    driver: bridge

volumes:
  postgres_data:
